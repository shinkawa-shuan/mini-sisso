[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "mini-sisso"
version = "1.3.6"
description = "High-performance SISSO implementation with Rust backend."
readme = "README.md"
requires-python = ">=3.8"
license = "MIT"
authors = [
  { name = "shinkawa shuan", email = "s.shuan16@gmail.com" },
]
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: 3",
]
dependencies = [
    "numpy>=1.20.0",
    "scikit-learn>=1.0.0",
    "pandas>=1.3.0",
    "lightgbm>=3.0.0",
    "dcor>=0.6",
]

[project.optional-dependencies]
dev = ["matplotlib"]

[tool.maturin]
python-source = "python"
module-name = "mini_sisso._mini_sisso_rs"
